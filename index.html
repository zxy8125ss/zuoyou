<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>千年对望</title>
<meta name="description" content="左手中国史，右手世界史：中外历史对照时间轴">
<meta name="theme-color" content="#F3F0E8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1916" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="千年对望">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png?v=1.0.4">
<link rel="apple-touch-icon" href="icons/icon-180.png?v=1.0.4">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <h1 class="brand" id="page-title">学习</h1>
  <button class="icon-btn" id="btn-search" aria-label="搜索">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
  </button>
</header>

<main id="view"><p class="empty">正在加载…</p></main>

<nav class="tabbar" id="tabbar">
  <button data-tab="learn" class="on"><svg viewBox="0 0 24 24"><path d="M3 5.5c3-1.3 6-1.3 9 .8 3-2.1 6-2.1 9-.8V19c-3-1.3-6-1.3-9 .8-3-2.1-6-2.1-9-.8z"/><path d="M12 6.3v13.5"/></svg><span>学习</span></button>
  <button data-tab="slice"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.5 2.6 3.6 5.4 3.6 8.5s-1.1 5.9-3.6 8.5c-2.5-2.6-3.6-5.4-3.6-8.5s1.1-5.9 3.6-8.5z"/></svg><span>切片</span></button>
  <button data-tab="timeline"><svg viewBox="0 0 24 24"><path d="M12 3v18M5 7h5M14 11h5M5 15h5M14 19h5"/></svg><span>对照</span></button>
  <button data-tab="people"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4.5 4.5-6.5 8-6.5s7 2 8 6.5"/></svg><span>人物</span></button>
  <button data-tab="notes"><svg viewBox="0 0 24 24"><path d="M5 20h4l10.5-10.5a2.1 2.1 0 0 0-3-3L6 17z"/><path d="M14.5 8.5l3 3M12 20h8"/></svg><span>记录</span></button>
  <button data-tab="me"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></svg><span>我的</span></button>
</nav>

<div class="sheet-wrap" id="sheet" hidden>
  <div class="sheet-bg" data-close></div>
  <div class="sheet" role="dialog" aria-modal="true">
    <div class="sheet-grip"></div>
    <div class="sheet-body" id="sheet-body"></div>
  </div>
</div>

<div class="overlay" id="search" hidden>
  <div class="ov-head">
    <input id="search-input" type="search" placeholder="搜索事件、人物、地点、年份" autocomplete="off">
    <button class="text-btn" id="search-close">取消</button>
  </div>
  <div class="ov-body" id="search-results"></div>
</div>

<div class="overlay map-ov" id="mapview" hidden>
  <div class="ov-head">
    <div class="map-title" id="map-title"></div>
    <button class="text-btn" id="map-close">关闭</button>
  </div>
  <div class="map-stage" id="map-stage"><div class="map-inner" id="map-inner"></div></div>
  <div class="map-foot">
    <span>示意图，非精确疆域 · 双指缩放</span>
    <span class="map-btns"><button id="map-out" aria-label="缩小">−</button><button id="map-reset">复原</button><button id="map-in" aria-label="放大">＋</button></span>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="app.js"></script>
<script src="notes.js"></script>
</body>
</html>
